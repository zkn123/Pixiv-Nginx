server {
    include listen.conf;
    server_name i.pximg.net;
    server_name s.pximg.net;
    server_name pixiv.pximg.net;
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        # rewrite ^/(.*)$ https://i.pixiv.cat/$1 redirect;
        rewrite ^/(.*)$ https://i.pixiv.re/$1 redirect;
        proxy_pass https://[2606:4700:3038::6815:eb67];
        include proxy_set.conf;
    }
}

upstream dns-nextdns-io { 
    server [2a07:a8c0::32:35ac]:443;
    server [2a07:a8c0::9a:ed65]:443;
    server [2a07:a8c0::e6:a767]:443;
 }

server {
    access_log off;
    include listen.conf;
    server_name *.dns.nextdns.io;
    server_name dns.nextdns.io;
    location / {
        # 但优化连接参数来降低延迟
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_cache off;
        proxy_buffering on;
        proxy_pass https://dns-nextdns-io/3235ac/DESKTOP-MCR00IC/;
        proxy_ssl_name $host;
        proxy_ssl_server_name off;
        proxy_ssl_session_reuse on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding 'gzip, deflate, br';

        # 上游连接保持
        proxy_next_upstream error timeout invalid_header;
        proxy_next_upstream_timeout 2s;
        proxy_next_upstream_tries 2;

#         # 缓存控制
#         proxy_cache_bypass $skip_cache;
#         proxy_no_cache $skip_cache;
#         proxy_cache $proxy_cache;
#         proxy_cache_valid 200 302 3m;  # 成功响应缓存5分钟
#         proxy_cache_valid 404 1m;      # 404响应缓存1分钟
#         proxy_cache_background_update on;
#         proxy_cache_lock on;
#
#         proxy_cache_key "$scheme$request_method$request_uri$request_body";

server {
    include listen.conf;
    server_name www.instagram.com;
    server_name instagram.com;
    location / {
        proxy_pass https://$host;
        include proxy_set.conf;
    }
}
server {
    include listen.conf;
    server_name ~^scontent.*\.cdninstagram\.com$;
    # server_name scontent-hkg4-1.cdninstagram.com;
    server_name scontent.cdninstagram.com;
    server_name static.cdninstagram.com;
    server_name graph.instagram.com;
    server_name i.instagram.com;
    location / {
        proxy_pass https://$host;

        # 确保 Access-Control-Allow-Origin 包含完整的协议和域名
        add_header Access-Control-Allow-Origin https://www.instagram.com;
        # 允许凭证（如果需要的话）
        add_header Access-Control-Allow-Credentials true;

        include proxy_set.conf;
    }
}
server {
    include listen.conf;
    server_name edge-chat.instagram.com;
    location / {
        proxy_pass https://$host;

        proxy_read_timeout 3600s; # 延长Nginx读取后端响应的超时时间（默认60s）
        proxy_send_timeout 3600s; # 延长Nginx向后端发送数据的超时时间
        proxy_set_header Upgrade $http_upgrade; # 转发客户端的Upgrade请求头
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin https://www.instagram.com/;
        include proxy_set.conf;
    }
}
server {
    include listen.conf;
    server_name gateway.cdninstagram.com;

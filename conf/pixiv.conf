server {
    include listen.conf;
    server_name login.steampowered.com;
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://checkout.steampowered.com"; # 改为你的公网域名
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Origin,Accept';
            add_header Access-Control-Allow-Credentials 'true';

            # 关键：添加私有网络访问权限
            add_header Access-Control-Allow-Private-Network 'true';
            add_header Access-Control-Max-Age 1728000; # 20天缓存
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }


        proxy_pass https://184.87.103.42/;
        include proxy_set.conf;
    }
}
server {
    include listen.conf;
    server_name api.steampowered.com;
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Private-Network 'true';
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204; # 或者 return 200;
        }


        proxy_pass https://23.36.106.129/;
        include proxy_set.conf;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";

    }
}

#user  nobody;
worker_processes 4;

error_log Z:/temp/error.log;


events {
    worker_connections 1024;
}
http {
    access_log Z:/temp/access.log;
    resolver 192.168.1.1 ipv4=on ipv6=on valid=0s;
    resolver_timeout 30s;
    include ca.conf;
    include mime.types;

    default_type application/octet-stream;
    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';


    proxy_buffer_size 128k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 128k;

    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;
    keepalive_timeout 120;
    client_max_body_size 0;
    proxy_temp_path C:/nginx/temp;
    
    proxy_cache_path "C:/nginx/cache" levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=120m use_temp_path=off;
        # DNS相关的特殊缓存配置
    proxy_cache_path "C:/nginx/dns_cache" levels=1:2 keys_zone=dns_cache:10m max_size=100m inactive=5m use_temp_path=off;

    server_names_hash_max_size 1024;
    server_names_hash_bucket_size 1024;
    gzip on;
    http2 on;

    include domain.conf;
    include doh.conf;   # 放在最后：避免抢走 :443 的默认 server
}
